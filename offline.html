<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Sem conexão</title>
    <style>
        :root { color-scheme: light dark; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #f0f2f5; color: #1c2733; text-align: center; padding: 24px;
        }
        main { max-width: 360px; }
        h1 { font-size: 1.3rem; margin: 0 0 10px; }
        p { margin: 0 0 22px; line-height: 1.5; opacity: 0.85; }
        button {
            font: inherit; font-weight: 700; padding: 14px 26px; min-height: 48px;
            border: 0; border-radius: 10px; background: #001f3f; color: #fff; cursor: pointer;
        }
        @media (prefers-color-scheme: dark) { body { background: #10161d; color: #e8ecf1; } button { background: #e5c05b; color: #10161d; } }
    </style>
</head>
<body>
    <main>
        <h1>Você está sem conexão</h1>
        <p>Não foi possível carregar esta página. Verifique sua internet e tente novamente.</p>
        <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
</body>
</html>
